<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Churn Prediction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: #1e293b;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .nav-brand {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-brand span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 15px;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .nav-links a.active {
            color: #ffffff;
            background: rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(129, 140, 248, 0.4);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 440px;
            max-width: 100%;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            color: #4338ca;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            color: #0f172a;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: 6px;
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #4338ca 0%, #1d4ed8 100%);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            margin-bottom: 0;
            font-size: 14px;
            color: #64748b;
        }

        .footer-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
            transition: color 0.15s ease;
        }

        .footer-text a:hover {
            color: #312e81;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="nav-brand"><span>✦</span> ChurnPredict</a>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/login/">Login</a>
        <a href="/register/" class="active">Register</a>
    </div>
</nav>

<div class="main-wrapper">
    <div class="container">
        <div class="card-header">
            <div class="badge-icon">📝</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join our Customer Churn Prediction platform</p>
        </div>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="user_name">User Name</label>
                <input
                    id="user_name"
                    type="text"
                    name="user_name"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="mobile_number">Mobile Number</label>
                <input
                    id="mobile_number"
                    type="text"
                    name="mobile_number"
                    placeholder="Enter mobile number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="place">Place</label>
                <input
                    id="place"
                    type="text"
                    name="place"
                    placeholder="Enter city / place"
                    required
                >
            </div>

            <button type="submit">
                Register
            </button>
        </form>

        <p class="footer-text">
            Already have an account?
            <a href="/login/">Login</a>
        </p>
    </div>
</div>

</body>
</html>
